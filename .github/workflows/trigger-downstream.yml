name: Downstream runner (eccodes-python)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Number of the pull request whose commit to run downstream CI for
        required: true
        type: string
      level:
        description: '''all'', or the highest consumer level to run (as the run-downstream-ci labels)'
        required: true
        default: '1'
        type: string

concurrency:
  group: trigger-downstream-runner-${{ github.event.workflow_run.head_sha || inputs.pull-request }}
  cancel-in-progress: true

jobs:
  ci-approval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: ecmwf/ci-infrastructure/actions/require-ci-approval@main

  context:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    outputs:
      head-sha: ${{ steps.ctx.outputs.head-sha }}
      head-branch: ${{ steps.ctx.outputs.head-branch }}
      ci-conclusion: ${{ steps.ctx.outputs.ci-conclusion }}
      ci-url: ${{ steps.ctx.outputs.ci-url }}
      ci-run-id: ${{ steps.ctx.outputs.ci-run-id }}
      ci-summary: ${{ steps.ctx.outputs.ci-summary }}
      pull-request: ${{ steps.ctx.outputs.pull-request }}
      hpc-only: ${{ steps.ctx.outputs.hpc-only }}
    steps:
      - name: Resolve the commit under test
        id: ctx
        uses: ecmwf/ci-infrastructure/actions/resolve-dispatch-context@main
        with:
          pull-request: ${{ inputs.pull-request }}
    needs: [ci-approval]

  label-gate:
    if: needs.context.outputs.hpc-only != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      depth: ${{ steps.gate.outputs.depth }}
      quarantined: ${{ steps.gate.outputs.quarantined }}
    steps:
      - name: Check the downstream-CI label
        id: gate
        uses: ecmwf/ci-infrastructure/actions/should-downstream-run@main
        with:
          sha: ${{ needs.context.outputs.head-sha }}
          pull-request: ${{ needs.context.outputs.pull-request }}
          level: ${{ inputs.level }}
    needs: [ci-approval, context]

  validate:
    if: ${{ (needs.context.outputs.ci-conclusion == 'success') && needs['label-gate'].outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - id: mint
        uses: ecmwf/ci-infrastructure/actions/mint-token@main
        with:
          client-id: ${{ vars.CI_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_READER_APP_PRIVATE_KEY }}
          repositories: "*"
          permissions: contents:read actions:read
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.context.outputs.head-sha }}
          token: ${{ steps.mint.outputs.token }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: ecmwf/ci-infrastructure/actions/validate-generated-workflows@main
        with:
          token: ${{ steps.mint.outputs.token }}
    needs: [ci-approval, context, label-gate]

  resolve:
    if: ${{ (needs.context.outputs.ci-conclusion == 'success') && needs['label-gate'].outputs.run == 'true' }}
    needs: [ci-approval, context, label-gate, validate]
    runs-on: ubuntu-latest
    env:
      ARTIFACT_S3_ENDPOINT: ${{ secrets.ARTIFACT_S3_ENDPOINT }}
      ARTIFACT_S3_BUCKET: ${{ secrets.ARTIFACT_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    outputs:
      cfgrib: ${{ steps.r-cfgrib.outcome == 'success' && steps.r-cfgrib.outputs.json || '' }}
      cfgrib-ref: ${{ steps.r-cfgrib.outcome == 'success' && steps.r-cfgrib.outputs.own-sha || '' }}
      pdbufr: ${{ steps.r-pdbufr.outcome == 'success' && steps.r-pdbufr.outputs.json || '' }}
      pdbufr-ref: ${{ steps.r-pdbufr.outcome == 'success' && steps.r-pdbufr.outputs.own-sha || '' }}
      pins: ${{ steps.pins.outputs.pins }}
      dispatch-plans: ${{ steps.plans.outputs.dispatch-plans }}
    steps:
      - id: mint
        uses: ecmwf/ci-infrastructure/actions/mint-token@main
        with:
          client-id: ${{ vars.CI_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_READER_APP_PRIVATE_KEY }}
          repositories: cfgrib,ecbuild,eccodes,eccodes-python,eckit,findlibs,pdbufr,stack-dependencies
          permissions: contents:read actions:read
      - name: Pin the commits the upstream's CI resolved
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          HEAD_SHA: ${{ needs.context.outputs.head-sha }}
          CI_RUN_ID: ${{ needs.context.outputs.ci-run-id }}
        run: "set -euo pipefail\npins=\"${GITHUB_REPOSITORY}@${HEAD_SHA}\"\ndir=\"${RUNNER_TEMP}/resolved-pins\"\nif [ -n \"${CI_RUN_ID}\" ] && gh run download \"${CI_RUN_ID}\" --repo \"${GITHUB_REPOSITORY}\" \\\n     --name resolved-pins --dir \"$dir\" 2>/dev/null; then\n  while read -r pin; do\n    if [[ \"$pin\" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}$ ]] && [[ \"$pin\" != \"${GITHUB_REPOSITORY}@\"* ]]; then\n      pins=\"$pins $pin\"\n    fi\n  done < <(tr ' ' '\\n' < \"$dir/pins.txt\")\n  echo \"Starting from the commits run ${CI_RUN_ID} resolved: $pins\"\nelse\n  echo \"::notice::No resolved-pins artifact on CI run '${CI_RUN_ID}'; the other repos resolve at their branch tips.\"\nfi\necho \"PINS=$pins\" >> \"$GITHUB_ENV\"\necho \"EXPECTED=\" >> \"$GITHUB_ENV\"\n"
      - id: pick-cfgrib
        if: (needs['label-gate'].outputs.depth == 'all' || needs['label-gate'].outputs.depth >= 1)
        uses: ecmwf/ci-infrastructure/actions/pick-ref@main
        with:
          repo: ecmwf/cfgrib
          try-branch: ${{ needs.context.outputs.head-branch }}
          fallback-ref: master
          token: ${{ steps.mint.outputs.token }}
      - if: (needs['label-gate'].outputs.depth == 'all' || needs['label-gate'].outputs.depth >= 1)
        uses: actions/checkout@v6
        with:
          repository: ecmwf/cfgrib
          ref: ${{ steps.pick-cfgrib.outputs.ref }}
          token: ${{ steps.mint.outputs.token }}
          persist-credentials: false
          path: .downstream/cfgrib
          sparse-checkout: .ci
      - name: Resolve cfgrib
        id: r-cfgrib
        if: (needs['label-gate'].outputs.depth == 'all' || needs['label-gate'].outputs.depth >= 1)
        continue-on-error: true
        uses: ecmwf/ci-infrastructure/actions/resolve-deps@main
        with:
          manifest: .downstream/cfgrib/.ci/manifest.toml
          current-branch: ${{ steps.pick-cfgrib.outputs.ref }}
          pin: ${{ env.PINS }}
          expected-artifacts: ${{ env.EXPECTED }}
          matrix: test
          token: ${{ steps.mint.outputs.token }}
          rebuild-missing: 'true'
      - name: Carry cfgrib's commits to the next consumer
        if: steps.r-cfgrib.outcome == 'success'
        env:
          R_PINS: ${{ steps.r-cfgrib.outputs.pins }}
          R_ARTIFACTS: ${{ steps.r-cfgrib.outputs.artifacts }}
        run: 'echo "PINS=${R_PINS}" >> "$GITHUB_ENV"

          echo "EXPECTED=${EXPECTED} ${R_ARTIFACTS}" >> "$GITHUB_ENV"'
      - id: pick-pdbufr
        if: (needs['label-gate'].outputs.depth == 'all' || needs['label-gate'].outputs.depth >= 1)
        uses: ecmwf/ci-infrastructure/actions/pick-ref@main
        with:
          repo: ecmwf/pdbufr
          try-branch: ${{ needs.context.outputs.head-branch }}
          fallback-ref: develop
          token: ${{ steps.mint.outputs.token }}
      - if: (needs['label-gate'].outputs.depth == 'all' || needs['label-gate'].outputs.depth >= 1)
        uses: actions/checkout@v6
        with:
          repository: ecmwf/pdbufr
          ref: ${{ steps.pick-pdbufr.outputs.ref }}
          token: ${{ steps.mint.outputs.token }}
          persist-credentials: false
          path: .downstream/pdbufr
          sparse-checkout: .ci
      - name: Resolve pdbufr
        id: r-pdbufr
        if: (needs['label-gate'].outputs.depth == 'all' || needs['label-gate'].outputs.depth >= 1)
        continue-on-error: true
        uses: ecmwf/ci-infrastructure/actions/resolve-deps@main
        with:
          manifest: .downstream/pdbufr/.ci/manifest.toml
          current-branch: ${{ steps.pick-pdbufr.outputs.ref }}
          pin: ${{ env.PINS }}
          expected-artifacts: ${{ env.EXPECTED }}
          matrix: test
          token: ${{ steps.mint.outputs.token }}
          rebuild-missing: 'true'
      - name: Carry pdbufr's commits to the next consumer
        if: steps.r-pdbufr.outcome == 'success'
        env:
          R_PINS: ${{ steps.r-pdbufr.outputs.pins }}
          R_ARTIFACTS: ${{ steps.r-pdbufr.outputs.artifacts }}
        run: 'echo "PINS=${R_PINS}" >> "$GITHUB_ENV"

          echo "EXPECTED=${EXPECTED} ${R_ARTIFACTS}" >> "$GITHUB_ENV"'
      - id: pins
        run: echo "pins=${PINS}" >> "$GITHUB_OUTPUT"
      - id: plans
        env:
          PLANS_0: ${{ steps.r-cfgrib.outputs.dispatch-plans || '[]' }}
          PLANS_1: ${{ steps.r-pdbufr.outputs.dispatch-plans || '[]' }}
        run: 'plans=$(printf ''%s\n'' "${PLANS_0}" "${PLANS_1}" | jq -cs ''add // []'')

          echo "dispatch-plans=${plans}" >> "$GITHUB_OUTPUT"'

  rebuild-producers:
    needs: [ci-approval, context, label-gate, resolve]
    runs-on: ubuntu-latest
    steps:
      - if: needs.resolve.outputs.dispatch-plans != '' && needs.resolve.outputs.dispatch-plans != '[]'
        uses: ecmwf/ci-infrastructure/actions/dispatch-producers@main
        with:
          dispatch-plans: ${{ needs.resolve.outputs.dispatch-plans }}
          repositories: cfgrib,ecbuild,eccodes,eccodes-python,eckit,findlibs,pdbufr,stack-dependencies
          client-id: ${{ vars.CI_DISPATCHER_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.CI_DISPATCHER_APP_PRIVATE_KEY }}
    if: ${{ needs['label-gate'].outputs.run == 'true' }}

  report-start:
    if: ${{ (needs.context.outputs.ci-conclusion == 'success') && needs['label-gate'].outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post pending downstream status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            "/repos/${{ github.repository }}/statuses/${{ needs.context.outputs.head-sha }}" \
            -f state=pending \
            -f context='downstream/runner' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description='Downstream runner tests running'
    needs: [ci-approval, context, label-gate]

  report-ci-failure:
    if: ${{ (needs.context.outputs.ci-conclusion != 'success' && needs.context.outputs.ci-conclusion != '') && needs['label-gate'].outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post downstream failure status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            "/repos/${{ github.repository }}/statuses/${{ needs.context.outputs.head-sha }}" \
            -f state=failure \
            -f context='downstream/runner' \
            -f target_url="${{ needs.context.outputs.ci-url }}" \
            -f description="${{ needs.context.outputs.ci-summary }}; downstream runner not run"
    needs: [ci-approval, context, label-gate]

  cfgrib:
    name: cfgrib
    needs: [ci-approval, context, label-gate, validate, resolve, rebuild-producers]
    if: ${{ (!cancelled() && !failure() && needs['validate'].result == 'success' && needs['resolve'].result == 'success') && needs['label-gate'].outputs.run == 'true' && (needs['label-gate'].outputs.depth == 'all' || needs['label-gate'].outputs.depth >= 1) && !contains(needs['label-gate'].outputs.quarantined, ',cfgrib,') }}
