  pdbufr:
    name: pdbufr
    needs: [ci-approval, context, label-gate, validate, resolve, rebuild-producers]
    if: ${{ (!cancelled() && !failure() && needs['validate'].result == 'success' && needs['resolve'].result == 'success') && needs['label-gate'].outputs.run == 'true' && (needs['label-gate'].outputs.depth == 'all' || needs['label-gate'].outputs.depth >= 1) && !contains(needs['label-gate'].outputs.quarantined, ',pdbufr,') }}
    uses: ecmwf/pdbufr/.github/workflows/cross-repo-trigger.yml@develop
    with:
      from-repo: ${{ github.repository }}
      from-sha: ${{ needs.context.outputs.head-sha }}
      from-jobs: '["eccodes-python/test"]'
      branch: ${{ needs.context.outputs.head-branch }}
      fallback-ref: develop
      pin: ${{ needs.resolve.outputs.pins }}
      resolved: ${{ needs.resolve.outputs.pdbufr }}
      resolved-ref: ${{ needs.resolve.outputs.pdbufr-ref }}
    secrets: inherit

  report-result:
    needs: [ci-approval, context, label-gate, validate, cfgrib, pdbufr]
    if: ${{ (always() && needs.context.outputs.ci-conclusion == 'success') && needs['label-gate'].outputs.run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post final downstream status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=success
          for r in ${{ needs.validate.result }} ${{ needs.cfgrib.result }} ${{ needs.pdbufr.result }}; do
            if [ "$r" = failure ] || [ "$r" = cancelled ]; then
              state=failure
            fi
          done
          depth="${{ needs['label-gate'].outputs.depth }}"
          scope=""
          if [ "$depth" != all ]; then scope=" (up to level $depth)"; fi
          gh api -X POST \
            "/repos/${{ github.repository }}/statuses/${{ needs.context.outputs.head-sha }}" \
            -f state="$state" \
            -f context='downstream/runner' \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="Downstream runner tests $state$scope"
